name: Cloud Build & Local Flash

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Compile Firmware
        run: pio run

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          path: .pio/build/**/firmware.bin

  deploy:
    runs-on: self-hosted
    needs: build
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: esp32-firmware
          path: ./build

      # Build without cache to force the updated Dockerfile [cite: 2026-02-11]
      - name: Build Flash Tool
        run: docker build --no-cache -t esp32-flash-tool:${{ github.sha }} .

      # Explicitly override the entrypoint to ensure pio is not called [cite: 2026-02-11]
      - name: Flash Firmware
        run: |
          docker run --rm \
            --device=/dev/ttyUSB0 \
            --entrypoint "" \
            -v ${{ github.workspace }}/build:/flash \
            esp32-flash-tool:${{ github.sha }} \
            esptool.py --chip esp32 --port /dev/ttyUSB0 --baud 460800 write_flash 0x10000 /flash/*/firmware.bin

      - name: Cleanup Docker Image
        if: always()
        run: docker rmi esp32-flash-tool:${{ github.sha }}