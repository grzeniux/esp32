name: Cloud Build & Local Flash

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Compile Firmware
        run: pio run

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          path: .pio/build/**/firmware.bin

  deploy:
    runs-on: self-hosted
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Upload to ESP32
        env:
          UPLOAD_PORT: ${{ vars.ESP32_UPLOAD_PORT }}
        shell: bash
        run: |
          PORT="${UPLOAD_PORT:-/dev/ttyUSB0}"
          echo "Using upload port: $PORT"
          if [ -n "$PORT" ]; then
            pio run -e esp32doit-devkit-v1 -t upload --upload-port "$PORT"
          else
            pio run -e esp32doit-devkit-v1 -t upload
          fi