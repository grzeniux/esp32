name: Cloud Build & Local Flash

on:
  push:
    branches:
      - main

jobs:
  build:
    # This runs for FREE on GitHub's powerful servers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Compile Firmware
        run: pio run

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          path: .pio/build/**/firmware.bin

  deploy:
    # This runs on your Raspberry Pi
    runs-on: self-hosted
    needs: build
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: esp32-firmware
          path: ./build

      # We still use Docker for flashing to keep your learning path!
      - name: Flash to ESP32 via Docker
        run: |
          docker run --rm \
            --device=/dev/ttyUSB0 \
            -v $(pwd)/build:/firmware_dir \
            python:3.11-slim \
            /bin/bash -c "pip install esptool && esptool.py --chip esp32 --port /dev/ttyUSB0 --baud 460800 write_flash 0x10000 /firmware_dir/*/firmware.bin"