name: Cloud Build & Local Flash

on:
  push:
    branches:
      - main

jobs:
  build:
    # Use GitHub-hosted runner for high-speed compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Cache PlatformIO core and libraries to speed up the build process
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # Compile the project and generate firmware.bin
      - name: Compile Firmware
        run: pio run

      # Save the compiled binary as an artifact to pass it to the local runner
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          path: .pio/build/**/firmware.bin
          if-no-files-found: error

  deploy:
    # Use your Raspberry Pi (self-hosted) for physical hardware access
    runs-on: self-hosted
    needs: build
    steps:
      # Retrieve the firmware compiled in the cloud
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: esp32-firmware
          path: ./build

      # Build the minimalist flashing container locally
      - name: Build Flash Tool
        run: docker build -t esp32-flash-tool .

      # Flash the firmware to ESP32 using the containerized esptool
      - name: Flash Firmware
        run: |
          docker run --rm \
            --device=/dev/ttyUSB0 \
            -v $(pwd)/build:/flash \
            esp32-flash-tool \
            --chip esp32 \
            --port /dev/ttyUSB0 \
            --baud 460800 \
            write_flash 0x10000 /flash/*/firmware.bin