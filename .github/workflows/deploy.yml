name: Cloud Build & Local Flash

on:
  push:
    branches:
      - main

jobs:
  build:
    # Run heavy compilation on GitHub's fast servers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Cache PlatformIO files to speed up subsequent builds
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # Build the project to generate firmware.bin
      - name: Compile Firmware
        run: pio run

      # Upload the binary to GitHub's cloud storage
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          path: .pio/build/**/firmware.bin
          if-no-files-found: error

  deploy:
    # Use your Raspberry Pi for physical hardware access
    runs-on: self-hosted
    needs: build
    steps:
      # Download the binary compiled in the cloud
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: esp32-firmware
          path: ./build

      # Build the local flash tool image (only on changes)
      - name: Build Flash Tool
        run: docker build -t esp32-flash-tool .

      # Flash the firmware using the containerized esptool.py
      - name: Flash Firmware
        run: |
          docker run --rm \
            --device=/dev/ttyUSB0 \
            -v ${{ github.workspace }}/build:/flash \
            esp32-flash-tool \
            esptool.py --chip esp32 --port /dev/ttyUSB0 --baud 460800 write_flash 0x10000 /flash/*/firmware.bin